<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Dashboard Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;700&amp;family=Fira+Code:wght@400;700&amp;family=VT323&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-bar">
  <h1 class="app-title">ASCII Dashboard Generator</h1>
  <label class="field">Chủ đề <select id="theme-select"></select></label>
  <label class="field">Viền
    <select id="border-select">
      <option value="ascii">ASCII (+-|)</option>
      <option value="unicode">Unicode (┌─┐)</option>
    </select>
  </label>
  <label class="field">Số cột
    <select id="cols-select">
      <option value="80">80</option>
      <option value="96" selected>96</option>
      <option value="120">120</option>
    </select>
  </label>
  <label class="field">Bước <select id="step-select"></select></label>
  <span id="check-status" class="check-status"></span>
  <button id="export-open" class="btn btn-primary" type="button">Xuất</button>
</header>
<main class="stage">
  <div id="screen" class="adg-screen"><div id="preview" class="adg-pre"></div></div>
</main>

<div id="export-overlay" class="overlay" hidden>
  <div id="export-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="export-title" tabindex="-1">
    <div class="dialog-head">
      <h2 id="export-title">Xuất &amp; chia sẻ</h2>
      <button id="export-close" class="btn btn-icon" type="button" aria-label="Đóng">&times;</button>
    </div>

    <section class="card">
      <h3>Ảnh PNG</h3>
      <div class="opt-row"><span class="opt-label">Tỉ lệ</span>
        <div id="png-scales" class="seg">
          <button type="button" class="btn" data-scale="1" aria-pressed="false">1x</button>
          <button type="button" class="btn" data-scale="2" aria-pressed="true">2x</button>
          <button type="button" class="btn" data-scale="3" aria-pressed="false">3x</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="opt-chrome"> Kèm window chrome</label>
      <div class="opt-grid">
        <label class="field-col">Kiểu cửa sổ <select id="opt-win"></select></label>
        <label class="field-col">Font <select id="opt-font"></select></label>
        <label class="field-col">Cỡ chữ (px) <input id="opt-size" type="number" min="6" max="48" step="0.5"></label>
        <label class="field-col">Credit <input id="opt-credit" type="text" maxlength="60"></label>
      </div>
      <div class="opt-row">
        <label class="check"><input type="checkbox" id="opt-glow"> Glow</label>
        <label class="check"><input type="checkbox" id="opt-scanline"> Scanline</label>
      </div>
      <div id="png-size" class="mono mut"></div>
      <button id="png-download" class="btn btn-primary" type="button">Tải PNG</button>
    </section>

    <section id="export-motion" class="card" hidden></section>

    <section class="card">
      <div class="card-head"><h3>Plain text</h3>
        <button id="text-copy" class="btn" type="button">Copy để dán vào code block</button></div>
      <pre id="text-preview" class="text-preview" tabindex="0"></pre>
    </section>

    <div class="two-col">
      <section class="card">
        <h3>Config</h3>
        <button id="json-download" class="btn" type="button">Tải file .json</button>
        <button id="json-open" class="btn" type="button">Mở từ file .json</button>
        <input id="json-file" type="file" accept=".json,application/json" hidden>
      </section>
      <section class="card">
        <h3>Share link</h3>
        <input id="share-url" class="mono" type="text" readonly aria-label="Share link">
        <button id="share-copy" class="btn btn-primary" type="button">Copy link</button>
        <ul id="share-warn" class="warn-list"></ul>
      </section>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- order = dependency order: core → blocks → templates → output → app (tests/run.js reads this list) -->
<script src="js/core/text-utils.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/markup.js"></script>
<script src="js/core/grid.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/flow-dsl.js"></script>
<script src="js/core/flow-graph.js"></script>
<script src="js/blocks/registry.js"></script>
<script src="js/blocks/status.js"></script>
<script src="js/blocks/header.js"></script>
<script src="js/blocks/steps.js"></script>
<script src="js/blocks/meters.js"></script>
<script src="js/blocks/log.js"></script>
<script src="js/blocks/table.js"></script>
<script src="js/blocks/timeline.js"></script>
<script src="js/blocks/side-column.js"></script>
<script src="js/blocks/flow-presets.js"></script>
<script src="js/blocks/flow.js"></script>
<script src="js/templates/agent-pipeline.js"></script>
<script src="js/output/html-renderer.js"></script>
<script src="js/output/window-chrome.js"></script>
<script src="js/output/canvas-chrome.js"></script>
<script src="js/output/canvas-renderer.js"></script>
<script src="js/export/plain-text.js"></script>
<script src="js/export/png.js"></script>
<script src="js/export/config-file.js"></script>
<script src="js/export/share-link.js"></script>
<script src="js/ui/export-dialog.js"></script>
<script src="js/app.js"></script>
</body>
</html>
