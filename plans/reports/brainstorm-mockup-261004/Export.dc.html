<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xuất &amp; chia sẻ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#0d0f14}
a{color:#ecd67a}a:hover{color:#f6e7a6}
button,select,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 640px; min-height: 1120px; box-sizing: border-box; padding: 28px; background: #12141b; color: #d9dce5; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Xuất &amp; chia sẻ</h1>
<a href="Main.dc.html" aria-label="Đóng" style="width: 40px; height: 40px; display: grid; place-items: center; color: #c3c7d2; border: 1px solid #2a2f3c; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<section style="display: flex; gap: 20px; padding: 18px; background: #171a23; border: 1px solid #242836; border-radius: 12px">
<div style="flex: none; padding: 10px; background: #0a0b0f; border-radius: 8px; display: flex; align-items: flex-start">
<dc-import name="Terminal" theme="midnight" step="{{ 1 }}" font-size="{{ 2.4 }}" chrome="{{chrome}}" hint-size="146px,266px"></dc-import>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Ảnh PNG</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #8d93a5">Tỉ lệ</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{scales}}" as="s" hint-placeholder-count="3"><button aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.st}}">{{s.label}}</button></sc-for>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" checked="{{chrome}}" onChange="{{toggleChrome}}" style="width: 18px; height: 18px; accent-color: #ecd67a">Kèm window chrome (thanh 3 chấm)</label>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a5">{{pngSize}}</div>
<button style="align-self: flex-start; height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #ecd67a; color: #17181d; border: 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Tải PNG</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #171a23; border: 1px solid #242836; border-radius: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Ảnh động</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a5">chạy lại animation từ bước 1</span>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{formats}}" as="f" hint-placeholder-count="3"><button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.st}}">{{f.label}}</button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8d93a5">FPS
<select defaultValue="15" style="height: 36px; padding: 0 8px; background: #0f1117; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 6px; font-size: 12px"><option value="10">10</option><option value="15">15</option><option value="24">24</option><option value="30">30</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8d93a5">Tỉ lệ
<select defaultValue="1" style="height: 36px; padding: 0 8px; background: #0f1117; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 6px; font-size: 12px"><option value="1">1x</option><option value="2">2x</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8d93a5">Lặp
<select defaultValue="loop" style="height: 36px; padding: 0 8px; background: #0f1117; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 6px; font-size: 12px"><option value="loop">Vô hạn</option><option value="once">1 lần</option></select>
</label>
</div>
<div style="padding: 10px 12px; background: #0f1117; border: 1px solid #242836; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7; color: #c3c7d2">
<div>Thời lượng  <span style="color: #ecd67a">7 bước × 1.2 s = 8.4 s</span> · 126 frame</div>
<div>{{encoder}}</div>
<div style="color: #8d93a5">{{estimate}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a5"><span>Đang mã hoá frame 54/126</span><span>43%</span></div>
<div style="height: 8px; background: #0f1117; border-radius: 999px; overflow: hidden"><div style="width: 43%; height: 8px; background: #ecd67a"></div></div>
</div>
<div style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 16px; background: #ecd67a; color: #17181d; border: 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer">{{renderLabel}}</button>
<button style="height: 40px; padding: 0 16px; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px; font-size: 13px; cursor: pointer">Huỷ</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #171a23; border: 1px solid #242836; border-radius: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Plain text</h2>
<button style="height: 36px; padding: 0 14px; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px; font-size: 12px; cursor: pointer">Copy để dán vào code block</button>
</div>
<div style="padding: 10px 12px; background: #0f1117; border: 1px solid #242836; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.5; color: #c3c7d2; white-space: pre; overflow: hidden">{{plain}}</div>
</section>

<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #171a23; border: 1px solid #242836; border-radius: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Config</h2>
<button style="height: 40px; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px; font-size: 13px; cursor: pointer">Tải file .json</button>
<button style="height: 40px; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px; font-size: 13px; cursor: pointer">Mở từ file .json</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #171a23; border: 1px solid #242836; border-radius: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Share link</h2>
<input aria-label="Share link" readOnly="{{ true }}" value="https://you.github.io/ascii-gen/#c=eJy1V9tu4zYQ" style="height: 40px; padding: 0 10px; background: #0f1117; color: #c3c7d2; border: 1px solid #2a2f3c; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 0">
<button style="height: 40px; background: #ecd67a; color: #17181d; border: 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer">Copy link · 2.1 KB</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { scale: 2, fmt: 'mp4', chrome: true }; }
  renderVals() {
    const s = this.state;
    const pill = (on) => 'height:36px;padding:0 14px;border:1px solid ' + (on ? '#ecd67a' : '#2a2f3c') + ';border-radius:8px;font-size:12px;cursor:pointer;font-family:\'JetBrains Mono\',monospace;background:' + (on ? '#ecd67a' : 'transparent') + ';color:' + (on ? '#17181d' : '#c3c7d2') + ';font-weight:' + (on ? 600 : 400);
    const baseW = 757, baseH = s.chrome ? 1377 : 1346;
    const enc = {
      gif: ['GIF · encoder riêng · bảng màu lấy từ theme', '≈ 3–5 MB · chỉ ghi vùng thay đổi mỗi frame', 'Xuất GIF'],
      mp4: ['MP4 · WebCodecs (H.264) · không rớt frame', 'Không hỗ trợ → tự chuyển MediaRecorder (MP4/WebM)', 'Xuất MP4'],
      webm: ['WebM · MediaRecorder · ghi theo thời gian thực', 'Dùng cho Firefox', 'Xuất WebM']
    }[s.fmt];
    return {
      scales: [1, 2, 3].map((n) => ({ label: n + 'x', pressed: s.scale === n ? 'true' : 'false', st: pill(s.scale === n), pick: () => this.setState({ scale: n }) })),
      formats: [['gif', 'GIF'], ['mp4', 'MP4'], ['webm', 'WebM']].map(([id, label]) => ({ label, pressed: s.fmt === id ? 'true' : 'false', st: pill(s.fmt === id), pick: () => this.setState({ fmt: id }) })),
      chrome: s.chrome,
      toggleChrome: () => this.setState({ chrome: !this.state.chrome }),
      pngSize: (baseW * s.scale) + ' × ' + (baseH * s.scale) + ' px',
      encoder: enc[0], estimate: enc[1], renderLabel: enc[2],
      plain: '            AGENT PIPELINE · LEAD WORKS · ADVISOR ON CALL\n===============================================/##/=======\n  [#] lead high    [#] workers medium    [#] router forks\n\n   + plan  >   / fork   >  3 delegate  >  4 work  >  5 merge\n\n+--------------------------+          +-------------------\n|   ADVISOR · on call      |          |    LEAD · main ses'
    };
  }
}
</script>
</body>
</html>
