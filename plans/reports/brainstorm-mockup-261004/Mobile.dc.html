<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ASCII Dashboard Generator · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#0d0f14}
a{color:#ecd67a}a:hover{color:#f6e7a6}
button,select,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px; box-sizing: border-box; background: #0d0f14; color: #d9dce5; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #12141b; border-bottom: 1px solid #242836">
<div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px">ascii<span style="color: #ecd67a">/</span>dash</div>
<select aria-label="Template" defaultValue="pipeline" style="flex: 1; min-width: 0; height: 44px; padding: 0 10px; background: #171a23; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px; font-size: 13px">
<option value="pipeline">Agent pipeline</option>
<option value="server">Server monitor</option>
<option value="cicd">CI/CD build</option>
<option value="blank">Trống</option>
</select>
<a href="Export.dc.html" aria-label="Xuất" style="width: 44px; height: 44px; display: grid; place-items: center; background: #ecd67a; color: #17181d; border-radius: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></a>
</header>

<div style="padding: 16px 16px 12px; background-color: #0a0b0f; display: flex; justify-content: center">
<dc-import name="Terminal" theme="midnight" step="{{ 1 }}" font-size="{{ 5.5 }}" hint-size="334px,606px"></dc-import>
</div>
<div style="padding: 0 16px 12px; background: #0a0b0f; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a5; text-align: center">96 × 70 · tự thu nhỏ cho vừa bề ngang · chạm để phóng to</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #242836; border-bottom: 1px solid #242836; background: #12141b">
<button style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #ecd67a; color: #17181d; border: 0; border-radius: 8px; font-weight: 600; font-size: 14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"></path></svg>Phát</button>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #c3c7d2">2/7 · fork</div>
<input aria-label="Tốc độ" type="range" min="300" max="3000" defaultValue="2100" style="width: 100%; accent-color: #ecd67a">
</div>
<button aria-label="Randomize" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
<button aria-label="Share link" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 16px; border-bottom: 1px solid #242836; background: #12141b">
<button aria-pressed="true" style="height: 44px; background: transparent; border: 0; border-bottom: 2px solid #ecd67a; color: #f1f2f6; font-size: 13px; font-weight: 600">Khối</button>
<button aria-pressed="false" style="height: 44px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8d93a5; font-size: 13px">Giao diện</button>
<button aria-pressed="false" style="height: 44px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8d93a5; font-size: 13px">JSON</button>
</div>

<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #12141b; flex: 1">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; background: #171a23; border: 1px solid #242836; border-radius: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5d6375; width: 12px">{{b.n}}</span>
<span style="flex: 1; font-size: 14px">{{b.name}}</span>
<input type="checkbox" aria-label="Bật khối" defaultChecked="{{ true }}" style="width: 20px; height: 20px; accent-color: #ecd67a">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d93a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</div>
<sc-if value="{{b.open}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; margin-top: -4px; background: #171a23; border: 1px solid #3a3a2a; border-top: 0; border-radius: 0 0 8px 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8d93a5">Tiêu đề lớn
<input defaultValue="AGENT PIPELINE · {a1b:LEAD} WORKS · {a2b:ADVISOR} ON CALL" style="height: 44px; padding: 0 10px; background: #0f1117; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8d93a5">Legend · mỗi dòng một nhãn
<textarea rows="4" defaultValue="{{legend}}" style="padding: 8px 10px; background: #0f1117; color: #d9dce5; border: 1px solid #2a2f3c; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5"></textarea>
</label>
</div>
</sc-if>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Window chrome', 'Header', 'Steps', 'Side column + Flow', 'Timeline', 'Log tail + Meters', 'Status bar'];
    return {
      blocks: names.map((name, i) => ({ n: i + 1, name, open: i === 1 })),
      legend: '[#] lead high\n[#] workers medium\n[#] router forks\n[#] advisor on call'
    };
  }
}
</script>
</body>
</html>
